name: pr-summary
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const files = await github.paginate(github.rest.pulls.listFiles, {...scope, pull_number: context.issue.number, per_page: 100});
            const marker = '<!-- hires-pr-summary -->';
            const lines = [marker, '**Changes**', ...files.map(f => `- ${f.status}: ${JSON.stringify(f.filename)}`)];
            if (files.some(f => f.filename.startsWith('resumes/'))) {
              lines.push('', 'Resume changes require the verified submission flow. A service-authored PR is not proof of employment claims. Never put private contact data in public comments.');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {...scope, issue_number: context.issue.number, per_page: 100});
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            const body = lines.join('\n');
            if (existing) await github.rest.issues.updateComment({...scope, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...scope, issue_number: context.issue.number, body});
